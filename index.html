<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>队长定级数据看板</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    min-height:100vh;
    background:linear-gradient(160deg,#ff7a1a 0%,#ff9e2c 45%,#ffc44d 100%);
    color:#4a3520;
    display:flex; flex-direction:column; align-items:center;
    padding:14px 12px 18px;
  }
  .wrap { width:100%; max-width:640px; display:flex; flex-direction:column; gap:10px; }

  header { text-align:center; color:#fff; }
  header h1 { font-size:21px; letter-spacing:2px; font-weight:800; text-shadow:0 2px 8px rgba(200,90,0,.35); }

  .tabs { display:flex; gap:8px; justify-content:center; }
  .tab {
    padding:8px 0; width:110px; text-align:center;
    border-radius:999px; border:none;
    background:rgba(255,255,255,.28); color:#fff;
    font-size:15px; font-weight:700; cursor:pointer; transition:all .15s;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);
  }
  .tab.active { background:#fff; color:#ff6a00; box-shadow:0 3px 10px rgba(200,90,0,.3); }

  .card {
    background:#fff; border-radius:18px; padding:12px 12px 6px;
    box-shadow:0 8px 24px rgba(190,80,0,.22);
  }
  .card h2 { font-size:15px; color:#9a6a2f; font-weight:800; margin-bottom:4px; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .card h2 .week { color:#c9a06a; font-size:11.5px; font-weight:600; }

  table { width:100%; border-collapse:collapse; }
  th, td { padding:8px 4px; text-align:center; }
  th { color:#c9a06a; font-weight:700; font-size:11.5px; border-bottom:2px solid #ffe8c7; }
  td { border-bottom:1px solid #fff3e0; font-size:14px; }
  tr:last-child td { border-bottom:none; }

  .tier { display:inline-block; min-width:70px; padding:4px 10px; border-radius:999px; font-weight:800; font-size:12.5px; color:#fff; }
  .t-dashen { background:linear-gradient(135deg,#a855f7,#7c3aed); }
  .t-wangpai { background:linear-gradient(135deg,#fb5e5e,#e11d48); }
  .t-jinpai  { background:linear-gradient(135deg,#f7b733,#fc8a1e); }
  .t-yinpai  { background:linear-gradient(135deg,#b8c2cc,#8d99a8); }
  .t-chuyin  { background:linear-gradient(135deg,#7cc7f0,#4a9fd8); }
  .t-tongpai { background:linear-gradient(135deg,#d18a4e,#a86a32); }

  .range { font-variant-numeric:tabular-nums; font-weight:700; color:#5a4326; white-space:nowrap; }
  .score { font-variant-numeric:tabular-nums; color:#ff6a00; font-weight:800; font-size:16px; }

  .copybar { display:flex; justify-content:center; gap:10px; }
  .btn {
    border:none; border-radius:999px; cursor:pointer;
    padding:11px 22px; font-size:14px; font-weight:800;
    transition:transform .12s, box-shadow .12s;
  }
  .btn:active { transform:scale(.96); }
  .btn-primary { background:linear-gradient(135deg,#ff7a1a,#ff5722); color:#fff; box-shadow:0 4px 14px rgba(255,90,20,.45); }
  .btn-ghost { background:rgba(255,255,255,.3); color:#fff; box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.6); }

  .note { text-align:center; color:rgba(255,255,255,.92); font-size:11px; text-shadow:0 1px 3px rgba(200,90,0,.3); }
  .err { text-align:center; color:#c0392b; padding:24px 0; font-size:13px; }

  @media (max-width:480px) {
    body { padding:10px 8px 14px; }
    header h1 { font-size:18px; }
    .tab { width:31%; font-size:14px; }
    th { font-size:10.5px; }
    td { font-size:13px; padding:7px 2px; }
    .tier { min-width:60px; padding:3px 8px; font-size:11.5px; }
    .score { font-size:14.5px; }
    .btn { padding:10px 16px; font-size:13px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>队长定级数据看板</h1>
  </header>

  <div class="tabs" id="gameTabs"></div>

  <div class="card">
    <h2>本周排行 <span class="week" id="curWeek"></span></h2>
    <table>
      <thead><tr><th>定级</th><th>排名区间</th><th>分数线（积分）</th></tr></thead>
      <tbody id="curBody"></tbody>
    </table>
  </div>

  <div class="card">
    <h2>上周排行 <span class="week" id="prevWeek"></span></h2>
    <table>
      <thead><tr><th>定级</th><th>排名区间</th><th>分数线（积分）</th></tr></thead>
      <tbody id="prevBody"></tbody>
    </table>
  </div>

  <div class="copybar">
    <button class="btn btn-primary" id="copyCur">复制当前游戏</button>
    <button class="btn btn-ghost" id="copyAll">复制全部</button>
  </div>

  <div class="note">本周数据每日 10:00 更新，周日加密至 22:00 / 22:30 / 23:00 / 23:30 / 23:50 / 23:55 / 23:58；上周数据每周一 10:00 定榜后更新</div>
</div>

<script>
window.__loadFail = function(){
  document.getElementById("curBody").innerHTML = '<tr><td colspan="3" class="err">数据加载失败，请刷新重试</td></tr>';
};
fetch("https://tuwan-rank-1468920571.cos.ap-shanghai.myqcloud.com/data.json?v=" + new Date().getTime())
  .then(function(r){ return r.json(); })
  .then(function(d){ window.RANK_DATA = d; window.__boot(); })
  .catch(window.__loadFail);
</script>
<script>
window.__boot = function(){
  var TIER_CLASS = {"大神":"t-dashen","王牌":"t-wangpai","金牌":"t-jinpai","银牌":"t-yinpai","初级银牌":"t-chuyin","铜牌":"t-tongpai"};
  var curGame = null;

  if (!window.RANK_DATA) {
    document.getElementById("curBody").innerHTML = '<tr><td colspan="3" class="err">暂无数据，等待下次抓取</td></tr>';
    return;
  }
  var DATA = window.RANK_DATA;
  // 游戏列表跟随数据动态生成, 新增板块无需改页面
  var GAMES = Object.keys(DATA.current.games);
  curGame = GAMES[0];
  document.getElementById("curWeek").textContent =
    DATA.current_week + " · 数据取于 " + DATA.current.time;
  document.getElementById("prevWeek").textContent =
    DATA.last_week.week + " · 数据取于 " + DATA.last_week.fetched_at;

  var tabs = document.getElementById("gameTabs");
  GAMES.forEach(function(g){
    var b = document.createElement("button");
    b.className = "tab" + (g === curGame ? " active" : "");
    b.textContent = g;
    b.addEventListener("click", function(){
      curGame = g;
      Array.prototype.forEach.call(tabs.children, function(el){ el.classList.remove("active"); });
      b.classList.add("active");
      render();
    });
    tabs.appendChild(b);
  });

  function rows(tiers){
    if (!tiers || !tiers.length) return '<tr><td colspan="3" class="err">暂无数据</td></tr>';
    return tiers.map(function(t){
      return '<tr><td><span class="tier ' + (TIER_CLASS[t.name]||"") + '">' + t.name + '</span></td>' +
             '<td class="range">' + t.start + ' - ' + t.end + ' 名</td>' +
             '<td class="score">' + t.score + '</td></tr>';
    }).join("");
  }

  function render(){
    var cur = DATA.current.games[curGame];
    var prev = DATA.last_week.games[curGame];
    document.getElementById("curBody").innerHTML = rows(cur && cur.tiers);
    document.getElementById("prevBody").innerHTML = rows(prev && prev.tiers);
  }

  // "2026-08-16 23:58" -> "2026 年 08 月16日23:58"
  function fmtTime(label){
    var m = String(label).match(/(\d{4})-(\d{2})-(\d{2})\s+(\d{2}:\d{2})/);
    if (!m) return label;
    return m[1] + " 年 " + m[2] + " 月" + String(parseInt(m[3],10)) + "日" + m[4];
  }

  function blockText(game){
    var g = DATA.current.games[game];
    var lines = [fmtTime(DATA.current.time) + "（" + game + "）"];
    (g ? g.tiers : []).forEach(function(t){
      lines.push(t.name + "：" + t.start + "-" + t.end + " 名：" + t.score);
    });
    return lines.join("\n");
  }

  function copyText(text, btn){
    function done(){ var old = btn.textContent; btn.textContent = "已复制"; setTimeout(function(){ btn.textContent = old; }, 1500); }
    function fallback(){
      var ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); done(); } catch(e) {}
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else { fallback(); }
  }

  document.getElementById("copyCur").addEventListener("click", function(){
    copyText(blockText(curGame), this);
  });
  document.getElementById("copyAll").addEventListener("click", function(){
    copyText(GAMES.map(blockText).join("\n\n"), this);
  });

  render();
};
</script>
</body>
</html>
